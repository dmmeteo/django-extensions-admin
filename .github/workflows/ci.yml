name: CI

# The part of scripts/verify.sh that runs reliably on a GitHub-hosted Linux runner:
# lint, the Django test matrix and the real-worker journeys. The wheel/install smoke and
# the headless-browser smoke stay in scripts/verify.sh and are run locally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uvx ruff@0.14.14 check .
      - run: uvx ruff@0.14.14 format --check .
      - run: find src -name '*.js' -exec node --check {} +

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each lane installs the command-runner backend exactly as README documents it.
        include:
          - django: "5.2.*"
            tasks: "django-tasks-db[compat]==0.13.0"
          - django: "6.0.*"
            tasks: "django-tasks-db==0.13.0"
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the test suite on Django ${{ matrix.django }}
        run: >-
          uv run --no-project --python 3.13
          --with "django==${{ matrix.django }}" --with "${{ matrix.tasks }}"
          python tests/runtests.py tests
      - name: Run the command runner against a real db_worker
        env:
          DJANGO_SETTINGS_MODULE: worker_tests.settings
        run: >-
          uv run --no-project --python 3.13
          --with "django==${{ matrix.django }}" --with "${{ matrix.tasks }}"
          python tests/runtests.py worker_tests
