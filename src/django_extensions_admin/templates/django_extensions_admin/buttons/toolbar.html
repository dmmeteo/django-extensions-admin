{% for button in admin_ext_toolbar_buttons %}
  <li class="admin-ext-toolbar-item">
    <button type="submit" class="admin-ext-button{% if button.danger %} admin-ext-button--danger{% endif %}"
            form="{{ button.form_id }}" formaction="{{ button.url }}" formmethod="post"
            name="_admin_ext_return" value="{{ button.return_to }}">{{ button.label }}</button>
  </li>
{% endfor %}
